<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Home page options | Moisture Master Pros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/mmp.css?v=128">
<style>
.pk{ padding:clamp(36px,6vh,70px) var(--gut) clamp(50px,8vh,90px); }
.pk-in{ max-width:var(--maxw); margin-inline:auto; }
.pk-head{ margin-bottom:clamp(30px,5vh,52px); }
.pk-grid{ display:grid; gap:clamp(18px,2.4vw,30px); grid-template-columns:repeat(3,1fr); }
@media(max-width:1000px){ .pk-grid{ grid-template-columns:1fr; } }
.pk-card{ border:1.5px solid var(--line); border-radius:20px; background:#fff; overflow:hidden;
          display:flex; flex-direction:column; }
.pk-shot{ aspect-ratio:16/10; border-bottom:1px solid var(--line); position:relative;
          overflow:hidden; background:var(--paper); }
.pk-shot iframe{ position:absolute; top:0; left:0; width:1440px; height:900px;
                 transform:scale(.333); transform-origin:0 0; border:0; pointer-events:none; }
.pk-body{ padding:clamp(20px,2.4vw,28px); display:flex; flex-direction:column; gap:10px; }
.pk-tag{ font-family:var(--fm); font-size:.58rem; letter-spacing:.2em; text-transform:uppercase;
         color:var(--blue); margin:0; }
.pk-card h2{ font-family:var(--fd); font-weight:900; letter-spacing:-.03em; font-size:1.35rem; margin:0 0 6px; }
.pk-card .b{ align-self:flex-start; }
</style>
</head>
<body>

<section class="pk">
  <div class="pk-in">
    <div class="pk-head">
      <p class="pk-tag">For review, not live</p>
      <h1 class="d2" style="margin:0">Three ways to open the home page.</h1>
    </div>

    <div class="pk-grid">

      <article class="pk-card">
        <div class="pk-shot"><iframe src="/demo/hero-a.html" title="Option A preview" loading="lazy" tabindex="-1"></iframe></div>
        <div class="pk-body">
          <p class="pk-tag">Option A</p>
          <h2>The Split</h2>
          <a class="b b-sm" href="/demo/hero-a.html">Open option A</a>
        </div>
      </article>

      <article class="pk-card">
        <div class="pk-shot"><iframe src="/demo/hero-b.html" title="Option B preview" loading="lazy" tabindex="-1"></iframe></div>
        <div class="pk-body">
          <p class="pk-tag">Option B</p>
          <h2>Cause and Effect</h2>
          <a class="b b-sm" href="/demo/hero-b.html">Open option B</a>
        </div>
      </article>

      <article class="pk-card">
        <div class="pk-shot"><iframe src="/demo/hero-c.html" title="Option C preview" loading="lazy" tabindex="-1"></iframe></div>
        <div class="pk-body">
          <p class="pk-tag">Option C</p>
          <h2>Two Doors</h2>
          <a class="b b-sm" href="/demo/hero-c.html">Open option C</a>
        </div>
      </article>

    </div>
  </div>
</section>

</body>
</html>
